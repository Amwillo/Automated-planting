# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# maven.fabricmc.net can be very slow; give HTTP reads room to finish instead of failing.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.18.3

# Mod Properties
version=1.0.0
group=com.example.automatedplanting
archives_base_name=automated_planting

# Dependencies
fabric_api_version=0.155.3+26.1.2
# Compile-time only; the mod works without Mod Menu installed.
modmenu_version=18.0.0
